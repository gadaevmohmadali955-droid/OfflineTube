name: Build TubeSync Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Проверка репозитория (Checkout)
        uses: actions/checkout@v4

      - name: Настройка JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Выдача прав на выполнение gradlew
        run: chmod +x gradlew

      - name: Восстановление debug.keystore для подписи
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "debug.keystore успешно восстановлен из base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "debug.keystore сгенерирован заново"
          fi
          ls -la debug.keystore

      - name: Сборка Debug APK через Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Загрузка готового APK в артефакты GitHub
        uses: actions/upload-artifact@v4
        with:
          name: TubeSync-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Создание GitHub Release с APK файлом
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: release-build-${{ github.run_number }}
          name: TubeSync APK (Сборка #${{ github.run_number }})
          body: |
            ### 📱 Готовый APK TubeSync для телефона
            
            Файл для скачивания и установки на Android:
            - **app-debug.apk** (прикреплен ниже в Assets)
            
            #### Как установить на телефон:
            1. Нажмите на `app-debug.apk` в разделе **Assets** ниже, чтобы скачать файл.
            2. Откройте скачанный `.apk` на телефоне.
            3. Если появится предупреждение, разрешите установку из этого источника / браузера.
            4. Нажмите «Установить» и откройте приложение!
          files: app/build/outputs/apk/debug/*.apk
